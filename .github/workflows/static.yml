name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Anny generator syntax
        run: python -m compileall -q tools/anny-poc

      # The static site cannot run PyTorch in the browser. Generate one
      # neutral Anny GLB during the Pages build and serve it as a static asset.
      - name: Install CPU PyTorch for the bundled Anny body
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"

      - name: Install Anny model generation dependencies
        if: github.event_name != 'pull_request'
        run: python -m pip install -r tools/anny-poc/requirements.txt

      - name: Generate bundled Anny body model
        if: github.event_name != 'pull_request'
        run: python tools/anny-poc/generate.py --device cpu --output public/models/anny-neutral.glb

      - name: Validate bundled Anny model
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh

          model = Path("public/models/anny-neutral.glb")
          report = json.loads(model.with_suffix(".json").read_text(encoding="utf-8"))
          scene = trimesh.load(model, force="scene")
          meshes = [item for item in scene.geometry.values() if isinstance(item, trimesh.Trimesh)]
          assert model.is_file() and model.stat().st_size > 1000
          assert meshes and report["vertex_count"] > 0 and report["triangle_count"] > 0
          assert "Not calibrated" in report["measurement_status"]
          print(f"Validated bundled Anny GLB: {report['vertex_count']} vertices, {report['triangle_count']} triangles")
          PY

      - name: Audit uploaded GLB reference models
        if: github.event_name == 'pull_request'
        run: |
          python tools/audit_glb_models.py

      - name: Analyze bundled Anny body cross-sections
        if: github.event_name != 'pull_request'
        run: |
          python tools/anny-poc/analyze_profile.py --model public/models/anny-neutral.glb --output public/models/anny-neutral-profile.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("public/models/anny-neutral-profile.json").read_text())
          assert report["closed_section_samples"] >= 12
          assert report["heuristic_candidates"]["waist_minimum"] is not None
          print("Anny section-profile diagnostics validated")
          PY

      - name: Test Anny profile analyzer with a synthetic closed mesh
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install trimesh networkx scipy
          python - <<'PY'
          import trimesh
          mesh = trimesh.creation.cylinder(radius=1.0, height=2.0, sections=64)
          mesh.export('/tmp/profile-test.glb')
          PY
          python tools/anny-poc/analyze_profile.py --model /tmp/profile-test.glb --output /tmp/profile-test.json --samples 31
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/profile-test.json').read_text())
          assert report['closed_section_samples'] >= 12
          assert report['heuristic_candidates']['waist_minimum'] is not None
          PY

      - name: Test Anny contour candidate ranking
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import importlib.util
          import numpy as np
          spec = importlib.util.spec_from_file_location("analyze_profile", "tools/anny-poc/analyze_profile.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          center = np.array([0.0, 0.0])
          span = np.array([4.0, 4.0])
          def contour(perimeter, centroid, compactness=0.75, ratio=1.0):
              return {"perimeter_model_units": perimeter, "centroid_xy": list(centroid),
                      "compactness": compactness, "width_depth_ratio": ratio}
          centered = contour(8.0, (0.0, 0.0))
          offset = contour(14.0, (2.0, 1.5))
          result = module.summarize_section([offset, centered], center, span)
          assert result["selected_contour"] is centered
          assert result["circumference_model_units"] == 8.0
          assert sum(item["selected"] for item in result["candidate_selection"]) == 1
          ambiguous = module.summarize_section(
              [contour(8.0, (0.0, 0.0)), contour(7.8, (0.01, 0.01))], center, span
          )
          assert "contour_selection_ambiguous_similar_candidate_scores" in ambiguous["diagnostics"]
          off_center = module.summarize_section([contour(9.0, (1.2, 0.0))], center, span)
          assert "selected_contour_centroid_off_body_center" in off_center["diagnostics"]
          empty = module.summarize_section([], center, span)
          assert empty["circumference_model_units"] is None and empty["confidence"] == 0.0
          print("Anny contour ranking tests passed")
          PY

      - name: Install Anny API test dependencies
        run: python -m pip install -r tools/anny-api/requirements.txt

      - name: Validate Anny API syntax
        run: python -m compileall -q tools/anny-api

      - name: Test Anny API input validation
        run: python -m unittest discover -s tools/anny-api -p 'test_*.py'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: built-site-${{ github.run_attempt }}
          path: ./dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    concurrency:
      group: pages-deployment
      cancel-in-progress: true
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: built-site-${{ github.run_attempt }}
          path: ./dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./dist

      - name: Deactivate stale Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment: "github-pages", per_page: 100 }
            );

            for (const deployment of deployments) {
              if (deployment.sha === context.sha) continue;

              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 1
              });
              const latest = statuses.data[0];

              if (latest && (latest.state === "in_progress" || latest.state === "queued")) {
                core.warning(`Deactivating stale Pages deployment ${deployment.id} at ${deployment.sha}`);
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  state: "inactive",
                  description: "Superseded by a newer GitHub Pages deployment."
                });
              }
            }

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
